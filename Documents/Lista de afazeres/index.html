<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de afazeres</title>
    <link rel="stylesheet" href="./main.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Lista de afazeres</h1>
        <button type="submit">Adicionar tarefa</button>
    </header>
    <form>
        <h2>Inserir nova tarefa</h2>
        <div class="container">
            <input type="text" id="NovaTarefa" required placeholder="Insira a tarefa"/>
        </div>
        <div class="container">
            <button id="btn-confirmar" type="submit"> Adicionar</button>
            <button id="btn-cancelar" type="reset"> Cancelar </button>
            </div>
    </form>
    <div>
        <ol id="lista-tarefas">
        </ol>
    </div>
<script src="https://code.jquery.com/jquery-3.7.1.js"></script>
<script src="./main.js"></script>
</body>
</html>
